<!DOCTYPE html>
<!-- Generated by scripts/build.py from bib/$id.bib, abstract/$id.txt and publications.json. Do not edit by hand. -->
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>$page_title</title>
  <meta name="description" content="$description" />
  <link rel="canonical" href="$url" />

  <!-- Google Scholar (Highwire Press) -->
$scholar_meta

  <meta property="og:type" content="article" />
  <meta property="og:title" content="$og_title" />
  <meta property="og:description" content="$og_description" />
  <meta property="og:image" content="$image" />
  <meta property="og:url" content="$url" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="$og_title" />
  <meta name="twitter:description" content="$og_description" />
  <meta name="twitter:image" content="$image" />

  <script type="application/ld+json">
$json_ld
  </script>

  <link href="/img/icons/ita.ico" rel="icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" media="print" onload="this.media='all'" rel="stylesheet" />
  <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  </noscript>
  <link href="/css/style.css?v=$css_version" rel="stylesheet" />
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print"
    onload="this.media='all'" rel="stylesheet" />
  <noscript>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet" />
  </noscript>
  <link href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" media="print"
    onload="this.media='all'" rel="stylesheet" />
  <noscript>
    <link href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css" rel="stylesheet" />
  </noscript>
  <script async="" src="https://www.googletagmanager.com/gtag/js?id=G-VEERY7MNTH"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag() { dataLayer.push(arguments); }
    gtag('js', new Date());
    gtag('config', 'G-VEERY7MNTH');
  </script>
</head>

<body>
  $header

  <main class="main-content">
    <a class="paper-back" href="/publications.html#$id"><i class="fa-solid fa-arrow-left"></i> All publications</a>

    <article>
      <div class="paper-kind">$kind</div>
      <h1 class="paper-title"$lang_attr>$title</h1>

      <div class="paper-meta">
        <div class="pub-authors">$authors</div>$equal_note
        <div class="pub-venue">$reference</div>
        <div class="pub-links">
          $buttons
        </div>
      </div>

      <figure class="paper-figure">
        <img src="$thumbnail" width="$thumb_width" height="$thumb_height" alt="$thumbnail_alt" />
      </figure>

      <section class="paper-section">
        <h2>Abstract</h2>
        <p$lang_attr>$abstract</p>
      </section>

      <section class="paper-section" id="cite">
        <div class="paper-section-row">
          <h2>Cite</h2>
          <button class="copy-btn" onclick="copyBibtex(this)"><i class="fa-solid fa-copy"></i> Copy BibTeX</button>
        </div>
        <pre id="bibtex-text">$bibtex</pre>
      </section>
    </article>
  </main>

  $footer

  <script>
    function copyBibtex(btn) {
      navigator.clipboard.writeText(document.getElementById('bibtex-text').textContent).then(() => {
        const original = btn.innerHTML;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> Copied!';
        setTimeout(() => { btn.innerHTML = original; }, 2000);
      });
    }
  </script>
</body>

</html>
