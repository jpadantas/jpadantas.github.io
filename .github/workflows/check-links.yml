name: Check External Links

on:
  workflow_dispatch: # Allows manual trigger anytime in GitHub Actions tab
  schedule:
    # Runs on the 1st of every month at 08:00 UTC
    - cron: '0 8 1 * *'

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Accept redirects, bot challenge codes (418 IEEE, 999 LinkedIn, 403 Cloudflare, 302 Scopus)
          # Exclude Lattes (due to legacy SSL cipher handshake incompatibility with Ubuntu runner)
          args: >-
            --verbose
            --no-progress
            --accept 200..=204,302,403,418,429,999
            --exclude '(lattes\.cnpq\.br|linkedin\.com)'
            --timeout 20
            --max-retries 3
            './*.html'
          fail: false
