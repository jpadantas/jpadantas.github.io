name: Check External Links

on:
  workflow_dispatch: # Allows manual trigger anytime in GitHub Actions tab
  schedule:
    # Runs on the 1st of every month at 08:00 UTC
    - cron: '0 8 1 * *'

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Settings are in lychee.toml, with explicit CLI excludes for runner compatibility
          args: >-
            --config lychee.toml
            --verbose
            --no-progress
            --exclude '(lattes\.cnpq\.br|linkedin\.com|latamt\.ieeer9\.org|ri\.cmu\.edu)'
            './*.html'
          fail: false
