name: Check External Links

on:
  workflow_dispatch: # Allows manual trigger anytime in GitHub Actions tab
  schedule:
    # Runs on the 1st of every month at 08:00 UTC
    - cron: '0 8 1 * *'

jobs:
  link-checker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Lychee Link Checker
        uses: lycheeverse/lychee-action@v2
        with:
          # Settings and exclusions are configured in lychee.toml and .lycheeignore
          args: >-
            --config lychee.toml
            --verbose
            --no-progress
            ./*.html
          fail: false
